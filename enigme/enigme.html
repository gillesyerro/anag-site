<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2EC;        /* blanc cassé mat */
    --navy:#0C1F3F;      /* bleu marine */
    --red:#D81E27;       /* rouge PSG */
    --grid:rgba(12,31,63,.05);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }

  /* Canvas 9:16 — 1080 x 1920 */
  .canvas{
    position:relative;
    width:1080px; height:1920px;
    overflow:hidden;
    background-color:var(--bg);
    /* quadrillage très atténué, sans marge */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:60px 60px;
    font-family:'Montserrat', sans-serif;
    color:var(--navy);
  }

  /* ---- TikTok SAFE ZONE : haut ~230 / bas ~520 / droite ~150 ---- */
  .safe{
    position:absolute;
    top:235px; left:60px; right:150px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }

  /* 1. Macaron BREVET 2026 */
  .badge{
    font-family:'Anton', sans-serif;
    font-size:42px; letter-spacing:3px;
    color:#fff; background:var(--navy);
    padding:16px 40px; border-radius:999px;
    border:4px solid var(--red);
    box-shadow:0 8px 18px rgba(12,31,63,.18);
    margin-bottom:34px;
  }

  /* 2. Accroche */
  .accroche{
    font-weight:900; font-size:54px; line-height:1.12;
    letter-spacing:-.5px; max-width:820px;
    margin-bottom:30px;
  }
  .accroche .red{ color:var(--red); }

  /* 3. Équation détourée */
  .eq{
    display:flex; align-items:center; justify-content:center;
    gap:18px; margin-bottom:6px; width:100%;
  }
  .eq img{
    filter:drop-shadow(0 10px 14px rgba(12,31,63,.18));  /* relief doux */
  }
  .maillot{ width:300px; height:330px; object-fit:contain; }
  .echarpe{ width:340px; height:240px; object-fit:contain; transform:rotate(-5deg); }

  /* pastille "+" en relief */
  .plus{
    flex:0 0 auto;
    width:96px; height:96px; border-radius:50%;
    background:var(--navy); color:#fff;
    font-family:'Anton',sans-serif; font-size:72px; line-height:96px;
    box-shadow:0 8px 16px rgba(12,31,63,.22);
  }

  .total{
    font-family:'Anton', sans-serif;
    font-size:172px; line-height:1; color:var(--navy);
    margin:6px 0 40px;
  }

  /* 4. Indice */
  .indice{
    font-weight:800; font-size:50px; line-height:1.25;
    max-width:780px; margin-bottom:42px;
  }
  .indice .red{ color:var(--red); }

  /* 5. Question — bloc rouge qui ferme le visuel */
  .closer{
    background:var(--red); color:#fff;
    font-weight:900; font-size:70px; line-height:1.1;
    letter-spacing:-.5px;
    padding:34px 56px; border-radius:28px;
    box-shadow:0 12px 26px rgba(216,30,39,.30);
    transform:rotate(-1.5deg);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="safe">

      <div class="badge">BREVET 2026</div>

      <div class="accroche">L'énigme qui rend <span class="red">fou</span><br>le Parc des Princes 😱</div>

      <div class="eq">
        <img class="maillot" src="maillot.png" alt="maillot PSG">
        <div class="plus">+</div>
        <img class="echarpe" src="echarpe.png" alt="écharpe Champions">
      </div>

      <div class="total">= 55 €</div>

      <div class="indice">Le maillot coûte <span class="red">5 € de plus</span> que l'écharpe.</div>

      <div class="closer">Combien coûte l'écharpe&nbsp;?</div>

    </div>
  </div>
</body>
</html>
