<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide page 2 — Trigo (copie bleue)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    /* PAGE 2 — Trigo : erreur fréquente vs bonne formule (cos = adj/hyp). COPIE BLEUE. */
    :root{
      --bleu:#1d3c9e; --rouge:#d11f1f; --vert:#1b8a3a; --carreau:56px; --sous:14px;
      --fine:#d3e0f4; --forte:#a9c2e6; --marge-col:#3f63b5; --papier:#e9f0fb; /* BLEU */
      --manuscrit:"Caveat","Comic Sans MS","Segoe Print",cursive;
      --safe-top:160px; --safe-bottom:480px; --safe-right:130px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0 0 40px;background:#c7ccd4;
      font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;}
    .barre{width:1080px;max-width:96vw;margin:18px 0 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .barre button{font:600 16px "Segoe UI",sans-serif;padding:10px 16px;border:2px solid var(--bleu);
      background:#fff;color:var(--bleu);border-radius:8px;cursor:pointer;}
    .barre button:hover{background:var(--bleu);color:#fff;}
    .barre .info{font-size:14px;color:#555;margin-left:auto;}
    body.capture .barre{display:none;}

    .feuille{position:relative;width:1080px;height:1920px;background:var(--papier);
      box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;transform-origin:top center;}
    @media (max-width:1120px){.feuille{transform:scale(calc(96vw / 1080));}}
    .colonnes{position:absolute;left:0;right:0;top:0;bottom:0;z-index:0;
      background-image:repeating-linear-gradient(to right, var(--forte) 0 1px, transparent 1px var(--carreau));}
    .grille{position:absolute;left:0;right:0;top:120px;bottom:130px;z-index:0;
      background-image:
        repeating-linear-gradient(to bottom, var(--forte) 0 1px, transparent 1px var(--carreau)),
        repeating-linear-gradient(to bottom, var(--fine) 0 1px, transparent 1px var(--sous));}
    .feuille::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--carreau)*3);width:2px;background:var(--marge-col);z-index:1;}
    .trous{position:absolute;top:0;bottom:0;left:24px;width:34px;z-index:1;pointer-events:none;
      background-image:radial-gradient(circle, #cdd9ee 0 13px, #9fb4d8 13px 15px, transparent 15px);
      background-size:34px 240px;background-position:center 150px;background-repeat:repeat-y;}

    .repere{position:absolute;pointer-events:none;z-index:5;}
    .repere.haut{top:0;left:0;right:0;height:var(--safe-top);}
    .repere.bas{bottom:0;left:0;right:0;height:var(--safe-bottom);}
    .repere.droite{top:0;bottom:0;right:0;width:var(--safe-right);}
    .repere.zone{background:rgba(209,31,31,.10);}
    body.capture .repere{display:none;}

    [contenteditable]{outline:none;}
    body:not(.capture) [contenteditable]:hover{background:rgba(29,60,158,.08);border-radius:4px;}

    .bloc{position:absolute;left:calc(var(--carreau)*4);right:var(--safe-right);font-family:var(--manuscrit);z-index:2;}
    .titre{top:var(--safe-top);color:var(--rouge);font-weight:700;font-size:58px;text-decoration:underline;}
    .config{top:300px;color:var(--bleu);font-size:34px;}
    .faux{top:370px;color:var(--rouge);font-size:38px;}
    .exact{top:620px;color:var(--vert);font-size:38px;}
    .faux .h,.exact .h{font-weight:700;font-size:44px;text-decoration:underline;}
    .ratio{display:flex;align-items:center;gap:18px;margin:12px 0 6px;}
    .ratio .lhs{font-size:46px;font-weight:700;}
    .frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-size:42px;}
    .exact .frac{font-size:46px;}
    .frac .num{padding:0 8px;}
    .frac .den{padding:4px 8px 0;border-top:3px solid currentColor;}
    .pied{position:absolute;top:1370px;right:var(--safe-right);color:var(--bleu);font-family:var(--manuscrit);
      font-weight:700;font-size:46px;z-index:2;}
    .pied .num{border:2px solid var(--bleu);border-radius:6px;padding:2px 18px;}

    .figure{position:absolute;top:890px;left:0;right:0;z-index:2;text-align:center;}
    .figure svg{width:360px;height:320px;}
  </style>
</head>
<body>
  <div class="barre">
    <button id="btn-capture">📸 Mode capture</button>
    <span class="info">Trigo — page 2 • copie bleue • 1080×1920</span>
  </div>

  <div class="feuille" id="feuille">
    <div class="colonnes"></div>
    <div class="grille"></div>
    <div class="trous"></div>
    <div class="repere haut zone"></div>
    <div class="repere bas zone"></div>
    <div class="repere droite zone"></div>

    <div class="bloc titre" contenteditable>Trigonométrie</div>
    <div class="bloc config" contenteditable>ABC rectangle en B — angle Â.</div>

    <div class="bloc faux">
      <span class="h">Erreur fréquente :</span>
      <div class="ratio">
        <span class="lhs">cos Â =</span>
        <span class="frac"><span class="num">BC</span><span class="den">AC</span></span>
      </div>
      <div contenteditable>✗ ça, c'est sin Â ! (côté opposé)</div>
    </div>

    <div class="bloc exact">
      <span class="h">La bonne formule :</span>
      <div contenteditable>Pour l'angle Â (adjacent / hypoténuse) :</div>
      <div class="ratio">
        <span class="lhs">cos Â =</span>
        <span class="frac"><span class="num">AB</span><span class="den">AC</span></span>
      </div>
      <div contenteditable>CAH : Cosinus = Adjacent / Hypoténuse</div>
    </div>

    <!-- FIGURE : triangle ABC rectangle en B -->
    <div class="figure">
      <svg viewBox="0 0 360 320">
        <polygon points="60,30 60,290 340,290" fill="none" stroke="#222" stroke-width="2.5"/>
        <path d="M82 290 L82 268 L60 268" fill="none" stroke="#222" stroke-width="2"/>
        <path d="M60 74 A 44 44 0 0 1 94 58" fill="none" stroke="#1d3c9e" stroke-width="2.5"/>
        <text x="78" y="104" font-family="Caveat" font-size="30" font-weight="700" fill="#1d3c9e">Â</text>
        <text x="50" y="26" font-family="Caveat" font-size="30" font-weight="700" fill="#222" text-anchor="end">A</text>
        <text x="50" y="312" font-family="Caveat" font-size="30" font-weight="700" fill="#222" text-anchor="end">B</text>
        <text x="350" y="312" font-family="Caveat" font-size="30" font-weight="700" fill="#222">C</text>
        <text x="44" y="165" font-family="Caveat" font-size="26" fill="#444" text-anchor="end">adj.</text>
        <text x="200" y="316" font-family="Caveat" font-size="26" fill="#444" text-anchor="middle">opp.</text>
        <text x="212" y="150" font-family="Caveat" font-size="26" fill="#444">hyp.</text>
      </svg>
    </div>

    <div class="pied"><span class="num" contenteditable>2</span></div>
  </div>

  <script>
    const btn=document.getElementById('btn-capture');
    btn.addEventListener('click',()=>{document.body.classList.toggle('capture');
      btn.textContent=document.body.classList.contains('capture')?'↩︎ (recharge pour revenir)':'📸 Mode capture';});
  </script>
</body>
</html>
