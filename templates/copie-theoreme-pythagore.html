<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide cours — Théorème de Pythagore (rédaction)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       SLIDE COURS — rédaction correcte du théorème de Pythagore
       Triangle ABC rectangle en B -> AC² = AB² + BC² (AC hypoténuse)
       Même copie (Seyès, colonnes pleine hauteur, blanc haut/bas,
       trous, safe zone). Tout éditable • figure optionnelle • capture.
       ============================================================ */
    :root{
      --bleu:#2342a8; --rouge:#d11f1f; --vert:#1b8a3a; --carreau:56px; --sous:14px;
      --fine:#e4e9f4; --forte:#b9c6e6; --marge-col:#e08a8a; --papier:#fdfdfb;
      --manuscrit:"Caveat","Comic Sans MS","Segoe Print",cursive;
      --safe-top:160px; --safe-bottom:480px; --safe-right:130px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0 0 40px;background:#c7ccd4;
      font-family:"Segoe UI",Roboto,Arial,sans-serif;
      display:flex;flex-direction:column;align-items:center;}
    .barre{width:1080px;max-width:96vw;margin:18px 0 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .barre button{font:600 16px "Segoe UI",sans-serif;padding:10px 16px;border:2px solid var(--bleu);
      background:#fff;color:var(--bleu);border-radius:8px;cursor:pointer;}
    .barre button:hover{background:var(--bleu);color:#fff;}
    .barre .info{font-size:14px;color:#555;margin-left:auto;}
    body.capture .barre{display:none;}

    .feuille{position:relative;width:1080px;height:1920px;background:var(--papier);
      box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;transform-origin:top center;}
    @media (max-width:1120px){.feuille{transform:scale(calc(96vw / 1080));}}
    .colonnes{position:absolute;left:0;right:0;top:0;bottom:0;z-index:0;
      background-image:repeating-linear-gradient(to right, var(--forte) 0 1px, transparent 1px var(--carreau));}
    .grille{position:absolute;left:0;right:0;top:120px;bottom:130px;z-index:0;
      background-image:
        repeating-linear-gradient(to bottom, var(--forte) 0 1px, transparent 1px var(--carreau)),
        repeating-linear-gradient(to bottom, var(--fine) 0 1px, transparent 1px var(--sous));}
    .feuille::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--carreau)*3);width:2px;background:var(--marge-col);z-index:1;}
    .trous{position:absolute;top:0;bottom:0;left:24px;width:34px;z-index:1;pointer-events:none;
      background-image:radial-gradient(circle, #c7ccd4 0 13px, #aab0bb 13px 15px, transparent 15px);
      background-size:34px 240px;background-position:center 150px;background-repeat:repeat-y;}

    .repere{position:absolute;pointer-events:none;z-index:5;}
    .repere.haut{top:0;left:0;right:0;height:var(--safe-top);}
    .repere.bas{bottom:0;left:0;right:0;height:var(--safe-bottom);}
    .repere.droite{top:0;bottom:0;right:0;width:var(--safe-right);}
    .repere.zone{background:rgba(209,31,31,.10);}
    body.capture .repere{display:none;}

    [contenteditable]{outline:none;}
    body:not(.capture) [contenteditable]:hover{background:rgba(35,66,168,.06);border-radius:4px;}

    .bloc{position:absolute;left:calc(var(--carreau)*4);right:var(--safe-right);font-family:var(--manuscrit);z-index:2;}
    .titre{top:var(--safe-top);color:var(--rouge);font-weight:700;font-size:58px;text-decoration:underline;}
    .redac{top:340px;color:var(--bleu);font-size:42px;line-height:1.35;}
    .formule{top:480px;left:calc(var(--carreau)*4);width:600px;border:2.5px solid var(--bleu);border-radius:8px;
      background:rgba(255,255,255,.5);text-align:center;padding:8px 0;
      color:var(--bleu);font-weight:700;font-size:62px;}
    .note{top:620px;color:var(--vert);font-size:42px;line-height:1.35;}
    .note .h{font-weight:700;}
    .pied{position:absolute;top:1370px;right:var(--safe-right);color:var(--bleu);font-family:var(--manuscrit);
      font-weight:700;font-size:46px;z-index:2;}
    .pied .num{border:2px solid var(--bleu);border-radius:6px;padding:2px 18px;}

    /* figure optionnelle */
    .figure{position:absolute;top:780px;left:340px;width:360px;z-index:2;text-align:center;}
    .figure svg{width:360px;height:300px;}
    body.sans-figure .figure{display:none;}
  </style>
</head>
<body>
  <div class="barre">
    <button id="btn-figure">▢ Figure (afficher/masquer)</button>
    <button id="btn-capture">📸 Mode capture</button>
    <span class="info">Slide cours Pythagore • 1080×1920 • clique pour modifier</span>
  </div>

  <div class="feuille" id="feuille">
    <div class="colonnes"></div>
    <div class="grille"></div>
    <div class="trous"></div>
    <div class="repere haut zone"></div>
    <div class="repere bas zone"></div>
    <div class="repere droite zone"></div>

    <div class="bloc titre" contenteditable>Théorème de Pythagore</div>

    <div class="bloc redac" contenteditable>Le triangle ABC est rectangle en B.<br>D'après le théorème de Pythagore :</div>

    <div class="bloc formule" contenteditable>AC² = AB² + BC²</div>

    <div class="bloc note" contenteditable><span class="h">AC est l'hypoténuse :</span><br>le côté opposé à l'angle droit.</div>

    <!-- FIGURE optionnelle : triangle ABC rectangle en B -->
    <div class="figure">
      <svg viewBox="0 0 360 300">
        <polygon points="70,40 70,250 330,250" fill="none" stroke="#222" stroke-width="2.5"/>
        <line x1="70" y1="40" x2="330" y2="250" stroke="#d11f1f" stroke-width="3"/>
        <path d="M92 250 L92 228 L70 228" fill="none" stroke="#222" stroke-width="2"/>
        <text x="58" y="36" font-family="Caveat" font-size="30" font-weight="700" fill="#222" text-anchor="end">A</text>
        <text x="58" y="282" font-family="Caveat" font-size="30" font-weight="700" fill="#222" text-anchor="end">B</text>
        <text x="342" y="282" font-family="Caveat" font-size="30" font-weight="700" fill="#222">C</text>
        <text x="215" y="135" font-family="Caveat" font-size="28" font-weight="700" fill="#d11f1f">hyp.</text>
      </svg>
    </div>

    <div class="pied"><span class="num" contenteditable>2</span></div>
  </div>

  <script>
    const btn=document.getElementById('btn-capture');
    btn.addEventListener('click',()=>{document.body.classList.toggle('capture');
      btn.textContent=document.body.classList.contains('capture')?'↩︎ (recharge pour revenir)':'📸 Mode capture';});
    document.getElementById('btn-figure').addEventListener('click',()=>document.body.classList.toggle('sans-figure'));
  </script>
</body>
</html>
