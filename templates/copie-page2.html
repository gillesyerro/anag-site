<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide contenu (page 2) — modèle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       PAGE 2 — MODÈLE de slide de contenu (carrousel TikTok)
       Même copie que la page 1 (Seyès, colonnes pleine hauteur,
       horizontales au centre, blanc haut/bas, trous, safe zone).
       Zone titre + zone de rédaction + encadré "à retenir" + n° page.
       Tout est éditable • 📸 Mode capture nettoie l'écran.
       ============================================================ */
    :root{
      --bleu:#2342a8; --rouge:#d11f1f; --carreau:56px; --sous:14px;
      --fine:#e4e9f4; --forte:#b9c6e6; --marge-col:#e08a8a; --papier:#fdfdfb;
      --manuscrit:"Caveat","Comic Sans MS","Segoe Print",cursive;
      --safe-top:160px; --safe-bottom:480px; --safe-right:130px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0 0 40px;background:#c7ccd4;
      font-family:"Segoe UI",Roboto,Arial,sans-serif;
      display:flex;flex-direction:column;align-items:center;}
    .barre{width:1080px;max-width:96vw;margin:18px 0 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .barre button{font:600 16px "Segoe UI",sans-serif;padding:10px 16px;border:2px solid var(--bleu);
      background:#fff;color:var(--bleu);border-radius:8px;cursor:pointer;}
    .barre button:hover{background:var(--bleu);color:#fff;}
    .barre .info{font-size:14px;color:#555;margin-left:auto;}
    body.capture .barre{display:none;}

    .feuille{position:relative;width:1080px;height:1920px;background:var(--papier);
      box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;transform-origin:top center;}
    @media (max-width:1120px){.feuille{transform:scale(calc(96vw / 1080));}}
    /* colonnes (verticales) : pleine hauteur */
    .colonnes{position:absolute;left:0;right:0;top:0;bottom:0;z-index:0;
      background-image:repeating-linear-gradient(to right, var(--forte) 0 1px, transparent 1px var(--carreau));}
    /* lignes horizontales : au centre seulement (blanc en haut/bas) */
    .grille{position:absolute;left:0;right:0;top:120px;bottom:130px;z-index:0;
      background-image:
        repeating-linear-gradient(to bottom, var(--forte) 0 1px, transparent 1px var(--carreau)),
        repeating-linear-gradient(to bottom, var(--fine) 0 1px, transparent 1px var(--sous));}
    .feuille::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--carreau)*3);width:2px;background:var(--marge-col);z-index:1;}
    .trous{position:absolute;top:0;bottom:0;left:24px;width:34px;z-index:1;pointer-events:none;
      background-image:radial-gradient(circle, #c7ccd4 0 13px, #aab0bb 13px 15px, transparent 15px);
      background-size:34px 240px;background-position:center 150px;background-repeat:repeat-y;}

    .repere{position:absolute;pointer-events:none;z-index:5;}
    .repere.haut{top:0;left:0;right:0;height:var(--safe-top);}
    .repere.bas{bottom:0;left:0;right:0;height:var(--safe-bottom);}
    .repere.droite{top:0;bottom:0;right:0;width:var(--safe-right);}
    .repere.zone{background:rgba(209,31,31,.10);}
    body.capture .repere{display:none;}

    [contenteditable]{outline:none;}
    body:not(.capture) [contenteditable]:hover{background:rgba(35,66,168,.06);border-radius:4px;}

    /* TITRE de la slide */
    .titre-slide{position:absolute;top:var(--safe-top);left:calc(var(--carreau)*4);right:var(--safe-right);
      color:var(--rouge);font-family:var(--manuscrit);font-weight:700;font-size:74px;line-height:1.1;
      text-decoration:underline;z-index:2;}

    /* ZONE DE RÉDACTION (sur les lignes) */
    .corps{position:absolute;top:340px;left:calc(var(--carreau)*4);right:var(--safe-right);
      color:var(--bleu);font-family:var(--manuscrit);font-size:50px;line-height:56px;z-index:2;}

    /* ENCADRÉ "à retenir" */
    .encadre{position:absolute;left:calc(var(--carreau)*4);right:var(--safe-right);top:1120px;
      border:3px solid var(--rouge);border-radius:8px;padding:14px 22px 20px;
      background:rgba(255,255,255,.5);color:var(--rouge);font-family:var(--manuscrit);z-index:2;}
    .encadre .titre{font-size:36px;font-weight:700;text-decoration:underline;margin-bottom:6px;}
    .encadre .corps-e{font-size:44px;line-height:1.2;}

    /* N° DE PAGE + flèche (dans la safe zone) */
    .pied{position:absolute;top:1370px;right:var(--safe-right);display:flex;align-items:center;gap:18px;
      color:var(--bleu);font-family:var(--manuscrit);font-weight:700;font-size:46px;z-index:2;}
    .pied .num{border:2px solid var(--bleu);border-radius:6px;padding:2px 18px;}
  </style>
</head>
<body>
  <div class="barre">
    <button id="btn-capture">📸 Mode capture</button>
    <span class="info">Slide 2 / contenu (modèle) • 1080×1920 • clique pour modifier</span>
  </div>

  <div class="feuille" id="feuille">
    <div class="colonnes"></div>
    <div class="grille"></div>
    <div class="trous"></div>
    <div class="repere haut zone"></div>
    <div class="repere bas zone"></div>
    <div class="repere droite zone"></div>

    <!-- TITRE -->
    <div class="titre-slide" contenteditable>La bonne méthode</div>

    <!-- CONTENU -->
    <div class="corps" contenteditable>
      Dans un triangle rectangle en A :<br>
      BC² = AB² + AC²<br>
      BC² = 3² + 4²<br>
      BC² = 9 + 16 = 25<br>
      BC = √25 = 5 cm ✓
    </div>

    <!-- ENCADRÉ -->
    <div class="encadre">
      <div class="titre">À retenir</div>
      <div class="corps-e" contenteditable>On finit TOUJOURS par la racine carrée : BC = √25 = 5, et pas 25 !</div>
    </div>

    <!-- N° PAGE -->
    <div class="pied">
      <span class="num" contenteditable>2</span>
      <svg width="120" height="38" viewBox="0 0 120 38">
        <line x1="0" y1="19" x2="108" y2="19" stroke="#2342a8" stroke-width="5"/>
        <path d="M108 19 L86 6 M108 19 L86 32" fill="none" stroke="#2342a8" stroke-width="5"/>
      </svg>
    </div>
  </div>

  <script>
    const btn=document.getElementById('btn-capture');
    btn.addEventListener('click',()=>{document.body.classList.toggle('capture');
      btn.textContent=document.body.classList.contains('capture')?'↩︎ (recharge pour revenir)':'📸 Mode capture';});
  </script>
</body>
</html>
