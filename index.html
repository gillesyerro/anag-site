<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>ClicMaths — Révisions Brevet Maths</title>
  <meta name="description" content="ClicMaths : réviser les maths du collège et le Brevet sous forme de quiz." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1d4ed8" />

  <!-- iPhone : installation sur l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ClicMaths" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- ====================== ÉCRAN D'ACCUEIL ====================== -->
    <section id="screen-home" class="screen is-active">
      <header class="app-header">
        <div class="app-header__title">
          <span class="app-header__logo">📐</span>
          <h1>ClicMaths</h1>
        </div>
        <p class="app-header__sub">Révisions Brevet Maths · quiz</p>

        <div class="countdown" id="countdown" hidden>
          <span class="countdown__label">Brevet Maths · <span id="cd-date"></span></span>
          <span class="countdown__big" id="cd-days">J−0</span>
          <span class="countdown__sub" id="cd-sub">avant l'épreuve</span>
        </div>
      </header>

      <div class="filters" id="filters" role="tablist" aria-label="Filtrer par matière"></div>

      <main class="cours-list" id="cours-list"></main>

      <footer class="app-footer">
        <p>Tes scores sont enregistrés sur cet appareil 📱</p>
        <button class="link-btn" id="reset-scores" type="button">Réinitialiser mes scores</button>
      </footer>
    </section>

    <!-- ====================== ÉCRAN QUIZ ====================== -->
    <section id="screen-quiz" class="screen">
      <header class="quiz-top">
        <button class="icon-btn" id="quiz-quit" type="button" aria-label="Quitter le quiz">✕</button>
        <div class="progress">
          <div class="progress__bar" id="progress-bar"></div>
        </div>
        <span class="quiz-count" id="quiz-count">1/6</span>
      </header>

      <main class="quiz-body">
        <p class="quiz-matiere" id="quiz-matiere"></p>
        <h2 class="quiz-question" id="quiz-question"></h2>
        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback" hidden>
          <p class="feedback__title" id="feedback-title"></p>
          <p class="feedback__text" id="feedback-text"></p>
        </div>
      </main>

      <footer class="quiz-bottom">
        <button class="btn btn--primary" id="next-btn" type="button" disabled>Valider</button>
      </footer>
    </section>

    <!-- ====================== ÉCRAN RÉSULTAT ====================== -->
    <section id="screen-result" class="screen">
      <main class="result">
        <div class="result__emoji" id="result-emoji">🎉</div>
        <h2 class="result__title" id="result-title">Bravo !</h2>
        <div class="result__score">
          <span id="result-score">0</span><span class="result__total" id="result-total">/6</span>
        </div>
        <p class="result__pct" id="result-pct">0 %</p>
        <p class="result__msg" id="result-msg"></p>
        <div class="result__best" id="result-best"></div>

        <div class="result__actions">
          <button class="btn btn--primary" id="retry-btn" type="button">Recommencer</button>
          <button class="btn btn--ghost" id="home-btn" type="button">Autres cours</button>
        </div>
      </main>
    </section>
  </div>

  <!-- Données des cours (à éditer pour changer le contenu) -->
  <script src="data/cours.js"></script>
  <!-- Logique de l'application -->
  <script src="js/app.js"></script>
</body>
</html>
